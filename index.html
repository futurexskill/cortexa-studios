<style>
  :root{
    --bg:#050506;
    --bg-soft:#0b0c10;
    --border:rgba(255,255,255,0.09);
    --orange:#ff7a3d;
    --blue:#3fa8ff;
    --text:#f4f2ee;
    --text-dim:#a7a6ad;
    --text-faint:#6c6b73;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .display{
    font-family:'Archivo Black',sans-serif;
    letter-spacing:0.02em;
    line-height:1;
  }
  .chrome-text{
    background:linear-gradient(180deg,#ffffff 0%,#d8dade 22%,#8d9099 46%,#fbfbfc 52%,#c7c9cf 72%,#ffffff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    filter:drop-shadow(0 2px 14px rgba(0,0,0,0.6));
  }
  a{color:inherit;text-decoration:none;}
  img,video,iframe{max-width:100%;display:block;}
  section{position:relative;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px;}

  body::after{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    z-index:2000;
    opacity:0.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- NAV ---------- */
  header{
    position:fixed;top:0;left:0;right:0;
    z-index:1000;
    padding:18px 0;
    background:linear-gradient(to bottom, rgba(5,5,6,0.85), transparent);
    transition:background 0.3s ease, backdrop-filter 0.3s ease;
  }
  header.scrolled{
    background:rgba(5,5,6,0.8);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  nav{
    display:flex;align-items:center;justify-content:space-between;
  }
  .logo{
    font-size:20px;
    letter-spacing:0.08em;
  }
  .icon-btn{
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:1px solid var(--border);
    font-size:15px;
    transition:transform 0.2s ease, border-color 0.2s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.35);}

  /* ---------- HERO ---------- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:100px 20px 40px;
    gap:0;
    position:relative;
    background:
      url('branding/brand-wall3.png') center 68% / cover no-repeat,
      var(--bg);
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    bottom:0;left:0;right:0;height:240px;
    background:linear-gradient(to top, var(--bg), transparent);
    pointer-events:none;
  }
  .brand-mark{
    position:relative;
    opacity:0;
    animation:fadeUp 0.9s ease forwards 0.15s;
  }
  .flare-line{
    position:absolute;
    top:50%;left:50%;
    width:150vw;height:1px;
    transform:translate(-50%,-50%);
    background:linear-gradient(90deg, transparent, var(--orange) 20%, rgba(255,255,255,0.85) 50%, var(--blue) 80%, transparent);
    opacity:0.55;
    z-index:-1;
  }
  .hero h1{
    font-size:clamp(44px, min(11vw, 13vh), 108px);
    position:relative;
    z-index:1;
  }
  .hero-tagline{
    position:relative;
    z-index:1;
    margin-top:14px;
    font-size:clamp(13px,2vw,16px);
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    opacity:0;
    animation:fadeUp 0.9s ease forwards 0.35s;
  }
  .hero-desc{
    position:relative;
    z-index:1;
    margin-top:26px;
    max-width:420px;
    font-size:14px;
    line-height:1.65;
    color:var(--text-dim);
    opacity:0;
    animation:fadeUp 0.9s ease forwards 0.8s;
  }
  .hero-actions{
    margin-top:22px;
    opacity:0;
    animation:fadeUp 0.9s ease forwards 0.95s;
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 30px;
    border-radius:100px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    transition:transform 0.25s ease, box-shadow 0.25s ease;
  }
  .btn-primary{
    background:linear-gradient(180deg, #ffffff, #d9dade);
    color:#0a0a0c;
    font-weight:700;
    box-shadow:0 8px 28px -6px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.15);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 34px -6px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.2);}

  /* hero video frame */
  .video-frame-wrap{
    margin-top:28px;
    opacity:0;
    animation:fadeUp 1s ease forwards 0.5s;
  }
  .video-frame{
    position:relative;
    width:min(280px, 74vw);
    aspect-ratio:9/16;
    border-radius:26px;
    overflow:hidden;
    background:#000;
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 25px 70px -20px rgba(255,122,61,0.3),
      0 25px 70px -15px rgba(63,168,255,0.25);
  }
  .video-frame::before{
    content:"";
    position:absolute;inset:-2px;
    border-radius:28px;
    padding:2px;
    background:linear-gradient(160deg, var(--orange), rgba(255,255,255,0.3), var(--blue));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    z-index:3;
  }
  .video-frame iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;
  }
  .video-notch{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:64px;height:5px;border-radius:100px;
    background:rgba(255,255,255,0.25);
    z-index:4;
  }
  .sound-toggle{
    position:absolute;
    bottom:14px;right:14px;
    z-index:4;
    width:36px;height:36px;
    border-radius:50%;
    background:rgba(5,5,6,0.65);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:15px;
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(18px);}
    to{opacity:1;transform:translateY(0);}
  }

  .reveal{
    opacity:0;
    transform:translateY(24px);
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  .reveal.in{opacity:1;transform:translateY(0);}

  /* ---------- FOOTER ---------- */
  footer{
    padding:48px 0 32px;
    text-align:center;
    background:var(--bg-soft);
    border-top:1px solid var(--border);
  }
  footer .logo{display:inline-block;margin-bottom:18px;}
  .social-icons{
    display:flex;gap:14px;justify-content:center;
    margin-bottom:16px;
  }
  .copyright{
    font-size:12px;
    color:var(--text-faint);
  }
</style>
</head>
<body>

<header id="siteHeader">
  <div class="wrap">
    <nav style="justify-content:flex-end;">
      <a href="https://www.instagram.com/thecortexa" target="_blank" rel="noopener" class="icon-btn" aria-label="Instagram">📸</a>
    </nav>
  </div>
</header>

<section class="hero" id="top">
  <div class="brand-mark">
    <span class="flare-line"></span>
    <h1 class="display chrome-text">CORTEXA</h1>
  </div>
  <p class="hero-tagline">Storytelling, Reimagined.</p>

  <div class="video-frame-wrap">
    <div class="video-frame">
      <div class="video-notch"></div>
      <iframe
        id="heroVideo"
        data-video-id="Y2NiEedO76Q"
        title="Cortexa short film"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        loading="lazy">
      </iframe>
      <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">🔇</button>
    </div>
  </div>

  <p class="hero-desc">Original stories crafted with imagination, innovation, and cinematic excellence.</p>
  <div class="hero-actions">
    <a href="https://www.instagram.com/thecortexa" target="_blank" rel="noopener" class="btn btn-primary">Explore Our Films</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <a href="#top" class="logo display chrome-text" style="font-size:22px;">CORTEXA</a>
    <div class="social-icons">
      <a href="https://www.instagram.com/thecortexa" target="_blank" rel="noopener" class="icon-btn" aria-label="Instagram">📸</a>
      <a href="https://www.youtube.com/@yvrCortexa" target="_blank" rel="noopener" class="icon-btn" aria-label="YouTube">▶️</a>
      <a href="https://www.facebook.com/profile.php?id=61592660908822" target="_blank" rel="noopener" class="icon-btn" aria-label="Facebook">👍</a>
    </div>
    <div class="copyright">&copy; <span id="year"></span> Cortexa</div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const header = document.getElementById('siteHeader');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 20);
  }, { passive: true });

  const reveals = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
  }, { threshold: 0.15 });
  reveals.forEach(el => io.observe(el));

  const heroVideo = document.getElementById('heroVideo');
  const videoId = heroVideo.dataset.videoId;
  const origin = window.location.origin.startsWith('http') ? window.location.origin : 'https://www.cortexa.com';
  heroVideo.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&modestbranding=1&playsinline=1&rel=0&enablejsapi=1&origin=${encodeURIComponent(origin)}`;

  const soundBtn = document.getElementById('soundToggle');
  let muted = true;
  soundBtn.addEventListener('click', () => {
    muted = !muted;
    heroVideo.contentWindow.postMessage(JSON.stringify({
      event: 'command',
      func: muted ? 'mute' : 'unMute',
      args: []
    }), '*');
    soundBtn.textContent = muted ? '🔇' : '🔊';
  });
</script>

</body>
